[pytest]
# Pytest-konfiguraatio kuvareseptien tuonnin testeille

testpaths = tests
python_files = test_*.py
python_classes = *Tests *Testcase
python_functions = test_*

# Merkitsijät (markers)
markers =
    integration: Integraatiotestit, jotka vaativat ulkoisia palveluita
    ocr: OCR-pohjaiset testit
    grocy: Grocy-integraation testit
    slow: Hitaat testit (timeout > 10s)
    mock: Mock-pohjaiset testit

# Output
addopts = 
    -v
    --strict-markers
    --tb=short

# Coverage
[coverage:run]
source = recipe_import,recipe_importer,normalizer
omit =
    */tests/*
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
